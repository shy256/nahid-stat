  <main>
    <header class="masthead">
      <a class="brand" href="/" aria-label="Mazda Analytics 首页">m<span class="brand-dot">.</span><span>Mazda Analytics</span></a>
      <span class="header-label">网站统计</span>
    </header>
    <section id="login" class="login-card" aria-labelledby="login-title">
      <svg class="login-icon" aria-hidden="true"><use href="#icon-monitoring-rounded"></use></svg>
      <h1 id="login-title">数据看板</h1>
      <form id="login-form">
        <label for="token">管理令牌</label>
        <input id="token" type="password" autocomplete="off" required placeholder="输入管理令牌">
        <button type="submit">进入看板<svg class="icon" aria-hidden="true"><use href="#icon-arrow-forward-rounded"></use></svg></button>
      </form>
    </section>
    <section id="dashboard" hidden aria-labelledby="site-title">
      <div class="title-row">
        <div class="page-title"><h1 id="site-title">网站概览</h1><p id="range-label"></p></div>
        <div class="controls">
          <div class="select-field"><svg class="icon" aria-hidden="true"><use href="#icon-language-rounded"></use></svg><label class="sr-only" for="site">站点</label><select id="site"></select></div>
          <div class="select-field"><svg class="icon" aria-hidden="true"><use href="#icon-calendar-today-outline-rounded"></use></svg><label class="sr-only" for="days">时间范围</label><select id="days"><option value="1">今天</option><option value="7" selected>近 7 天</option><option value="30">近 30 天</option></select></div>
          <button id="refresh" class="icon-button secondary" type="button" aria-label="刷新" title="刷新"><svg class="icon" aria-hidden="true"><use href="#icon-refresh-rounded"></use></svg></button>
          <button id="logout" class="icon-button text-button" type="button" aria-label="退出" title="退出"><svg class="icon" aria-hidden="true"><use href="#icon-logout-rounded"></use></svg></button>
        </div>
      </div>
      <details class="admin-testing">
        <summary>管理员测试访问</summary>
        <p>在要测试的网站打开标记链接，此浏览器的访问和事件将不计入统计。各域名需分别标记。</p>
        <div id="admin-links"></div>
      </details>
      <div class="metrics">
        <article class="metric"><div class="metric-label"><svg class="icon" aria-hidden="true"><use href="#icon-visibility-outline-rounded"></use></svg><span>页面浏览量</span><span class="metric-unit">PV</span></div><strong id="pv">—</strong></article>
        <article class="metric"><div class="metric-label"><svg class="icon" aria-hidden="true"><use href="#icon-ads-click-rounded"></use></svg><span>关键事件</span></div><strong id="event-total">—</strong></article>
      </div>
      <article class="panel trend-panel">
        <div class="panel-heading"><h2><svg class="icon" aria-hidden="true"><use href="#icon-monitoring-rounded"></use></svg>访问趋势</h2><span class="chart-key">PV</span></div>
        <div id="chart-frame" class="chart-frame">
          <div id="chart-scale" class="chart-scale" aria-hidden="true"></div>
          <div class="chart-plot">
            <div class="chart-grid" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
            <div id="chart" class="chart" role="img" aria-label="每日页面浏览量柱状图"></div>
            <div class="chart-axis"><span id="axis-start"></span><span id="axis-end"></span></div>
          </div>
        </div>
        <p id="trend-empty" class="empty trend-empty" hidden>暂无数据</p>
      </article>
      <div class="panel-grid">
        <article class="panel"><div class="panel-heading"><h2><svg class="icon" aria-hidden="true"><use href="#icon-description-outline-rounded"></use></svg>热门页面</h2><span class="column-label">浏览量</span></div><div id="pages"></div></article>
        <article class="panel"><div class="panel-heading"><h2><svg class="icon" aria-hidden="true"><use href="#icon-link-rounded"></use></svg>引流来源</h2><span class="column-label">浏览量</span></div><div id="sources"></div></article>
        <article class="panel"><div class="panel-heading"><h2><svg class="icon" aria-hidden="true"><use href="#icon-devices-outline-rounded"></use></svg>设备分布</h2><span class="column-label">浏览量</span></div><div id="devices"></div></article>
        <article class="panel"><div class="panel-heading"><h2><svg class="icon" aria-hidden="true"><use href="#icon-ads-click-rounded"></use></svg>关键事件</h2><span class="column-label">次数</span></div><div id="events"></div></article>
      </div>
    </section>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
